name: Archive gaps report (read-only)

# Which days of the announcement archive exist, and the markers behind them (scripts/archive_gaps_report.py).
# Reads R2 only; no model, no exchange call, no write.
on:
  workflow_dispatch:
  push:
    branches: [ccr-0caa4ce9-bh3n2s]
    paths:
      - 'scripts/archive_gaps_report.py'
      - '.github/workflows/archive-gaps-report.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/archive_gaps_report.py
