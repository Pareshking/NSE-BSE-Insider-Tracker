name: Joint NSE-BSE Data Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate both exchanges
        env:
          TARGET_DATE: '2026-08-31'
          SECOND_DATE: '2026-08-28'
        run: python scripts/validate_exchange_data.py
      - name: Publish evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/data_validation_v2 || true
          git diff --cached --quiet || git commit -m 'chore: publish joint exchange validation [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-nse-bse-validation
          path: artifacts/data_validation_v2
          retention-days: 14
