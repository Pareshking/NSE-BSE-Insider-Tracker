name: Announcement reader sample

# Real NSE filings (scripts/announcement_sample_expected.json) read by each
# model and compared with values read from each PDF by hand
# (scripts/announcement_sample.py). One job per reader, in parallel, each on
# the same filings and scored alone; a last job puts them in one table.
# Runs when the sample or its script changes on a PR, or by hand. Writes
# nothing to R2.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Symbols from the sample, comma-separated (empty = the run file, else all)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/announcement_sample.py'
      - 'scripts/announcement_sample_expected.json'
      - 'scripts/announcement_sample_run.txt'
      - '.github/workflows/announcement-sample.yml'

permissions:
  contents: read

jobs:
  plan:   # readers come from the run file's readers: line, else the script's default list
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.m.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: m
        run: echo "jobs=$(python3 scripts/announcement_sample.py --matrix)" >> "$GITHUB_OUTPUT"

  sample:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    name: read (${{ matrix.slug }})
    # Runs go side by side; only the same reader waits for its own job in an earlier run (a newer
    # pending job for it replaces the older one), so a model's free limit is never split between two jobs.
    concurrency:
      group: announcement-sample-${{ matrix.slug }}
      cancel-in-progress: false   # a job in progress keeps its log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read the sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ONLY: ${{ inputs.only || '' }}
          READER: ${{ matrix.reader }}
          SAMPLE_MINUTES: '85'
        run: python -u scripts/announcement_sample.py --readers "$READER" ${{ matrix.flags }} ${ONLY:+--only "$ONLY"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: announcement-sample-${{ matrix.slug }}
          path: announcement_sample_results.json
          if-no-files-found: ignore

  compare:
    needs: sample
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: announcement-sample-*
          path: results
      - name: One table for all readers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && python -u scripts/announcement_sample.py --combine results --rescore
