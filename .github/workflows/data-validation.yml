name: NSE-BSE Data Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Acquire BSE evidence
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/bse_raw_capture_v2.py
      - name: Acquire NSE evidence
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/nse_acquisition.py > artifacts/data_validation_v4/nse_acquisition_output.json
      - name: Run schema-aware NSE + BSE validation
        env:
          TARGET_DATE: '2026-08-31'
          SECOND_DATE: '2026-08-28'
        run: python scripts/data_validation_v4.py
      - name: Probe BSE 90-day date coverage
        if: always()
        env:
          TARGET_DATE: '2026-08-31'
          LOOKBACK_DAYS: '90'
        run: python scripts/bse_90day_probe.py
      - name: Probe BSE insider historical date selection
        if: always()
        run: |
          mkdir -p artifacts/insider_historical_probe
          python scripts/bse_insider_historical_probe.py | tee artifacts/insider_historical_probe/result.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-data-validation-v4
          path: |
            artifacts/data_validation_v4
            artifacts/bse_90day
            artifacts/insider_historical_probe
          retention-days: 14
