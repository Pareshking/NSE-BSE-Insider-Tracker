name: Announcement history backfill

# One manual kick of the same live-first, one-date historical worker used by the
# continuous announcement reader. This workflow must never launch a month matrix.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Oldest historical date to process (YYYY-MM-DD)'
        required: true
        default: '2026-01-01'
      to:
        description: 'Latest date eligible for historical work (YYYY-MM-DD; blank means today)'
        required: false
        default: ''
      batch_size:
        description: 'Maximum filings in the one AI batch'
        required: true
        default: '20'

permissions:
  contents: read

jobs:
  one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: announcement-reader-live
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CARD_PROMPT_VARIANT: v2
      CARD_PROMPT_COMPARE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Collect and process at most one historical date
        env:
          HISTORY_FROM: ${{ inputs.from || '2026-01-01' }}
          HISTORY_TO: ${{ inputs.to }}
          BATCH_SIZE: ${{ inputs.batch_size || '20' }}
        run: |
          set -euo pipefail
          end="${HISTORY_TO:-$(date -u +%F)}"
          python -u scripts/announcement_backfill.py --continuous \
            --from "$HISTORY_FROM" --to "$end" \
            --batch-size "$BATCH_SIZE" --batch-minutes 5 --max-batches 1
