name: Chain stats (read-only)

# What is in each clean table, for the data chain audit (scripts/chain_stats.py). Reads R2 only; no exchange call, no write.
on:
  workflow_dispatch:
  push:
    branches: [audit/data-chain]
    paths:
      - 'scripts/chain_stats.py'
      - '.github/workflows/chain-stats.yml'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Peek
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/chain_stats.py
