name: Storage trim (keep R2 small)

# scripts/storage_trim.py. Owner, 15 Nov 2026: "bring it to 1 GB or less"; delete the raw results XBRL (its facts are in
# the archive) and keep the last 90 days of filing text. By hand: pick the steps; type 1 in `delete` to delete,
# otherwise it is a dry run that lists what would go.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps, space separated: results_xbrl filing_text report'
        required: false
        default: 'report'
      delete:
        description: 'Type 1 to delete (otherwise a dry run)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: r2-archive-writes
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trim
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          STEPS: ${{ inputs.steps || 'report' }}
          DELETE: ${{ inputs.delete == '1' && '--delete' || '' }}
        run: python -u scripts/storage_trim.py $STEPS $DELETE
