name: Storage trim (keep R2 small)

# scripts/storage_trim.py. Owner, 15 Nov 2026: "bring it to 1 GB or less"; delete the raw results XBRL (its facts are in
# the archive) and keep the last 90 days of filing text. By hand: pick the steps; type 1 in `delete` to delete,
# otherwise it is a dry run that lists what would go.
# Weekly guard (owner, 15 Nov: "weekly automatically clean job", "stay below 50% of Cloudflare limits"): every Sunday
# it trims, compresses new plain raw, prints the sizes, and fails (so it shows red) above 5 GB, half the free 10 GB.
on:
  schedule:
    - cron: '23 6 * * 0'  # Sunday 11:53 IST, after the Sunday retention run
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps, space separated: results_xbrl filing_text price_zips compress report'
        required: false
        default: 'report'
      delete:
        description: 'Type 1 to delete (otherwise a dry run)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: r2-archive-writes
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Trim
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # A scheduled run has no inputs: it runs every step and deletes.
          STEPS: ${{ github.event_name == 'schedule' && 'results_xbrl filing_text price_zips compress report' || inputs.steps || 'report' }}
          DELETE: ${{ (github.event_name == 'schedule' || inputs.delete == '1') && '--delete' || '' }}
        run: python -u scripts/storage_trim.py $STEPS $DELETE --limit-gb 5
