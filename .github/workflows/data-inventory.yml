name: Data inventory (read-only)

# Counts, schemas, date bounds and sample-size / power numbers for the R2
# bucket. Aggregate output only (no names, no rows). Reads R2 with the
# repository's existing secrets; the script calls get/list only.
# Manual run: Actions -> Data inventory -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/data_inventory.py --out inventory
      - name: Job summary
        if: always()
        run: |
          if [ -f inventory/inventory.md ]; then cat inventory/inventory.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-inventory
          path: inventory
          retention-days: 14
