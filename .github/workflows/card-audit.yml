name: Card audit (read-only)

# Prints every card the reader wrote in the last N hours next to the filing's own text, and re-checks quotes and
# numbers independently of the reader (scripts/card_audit.py). Reads R2 and the exchanges' PDFs; writes nothing.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Cards read in the last this many hours'
        required: false
        default: '6'
      ids_file:
        description: 'Golden set: a file of event_ids in the repo (scripts/golden_set.txt); overrides hours'
        required: false
        default: ''
      replay_run:
        description: 'Run id of a golden-set replay (announcement-reader.yml dry run): audit ITS cards instead of the stored ones'
        required: false
        default: ''
      excerpt:
        description: 'Characters of filing text shown at the start and round each quote (default 3000; 40000 = the whole filing)'
        required: false
        default: '3000'
  push:
    branches: [ccr-0caa4ce9-bh3n2s]
    paths:
      - 'scripts/card_audit.py'
      - '.github/workflows/card-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Download the replay
        if: ${{ inputs.replay_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.replay_run }}" -n announcement-pipeline-dry-run -D replay
      - name: Audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          HOURS: ${{ inputs.hours || '6' }}
          IDS_FILE: ${{ inputs.ids_file || '' }}
          REPLAY_JSON: ${{ inputs.replay_run != '' && 'replay/announcement_reader_dry_run.json' || '' }}
          EXCERPT: ${{ inputs.excerpt || '3000' }}
        run: python -u scripts/card_audit.py | tee card_audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-audit
          path: card_audit.md
          if-no-files-found: ignore
