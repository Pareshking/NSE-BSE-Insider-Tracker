name: Corporate peek (read-only)

# The clean rows behind a few companies, for audits (scripts/corporate_peek.py). Reads R2 only; no exchange call, no write.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Comma-separated NSE symbols'
        required: false
        default: ''
      sections:
        description: 'shareholding,issues,buybacks,actions,results,universe,meetings'
        required: false
        default: ''
  push:
    branches: [audit/corporate-data]
    paths:
      - 'scripts/corporate_peek.py'
      - '.github/workflows/corporate-peek.yml'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Peek
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SYMBOLS: ${{ inputs.symbols || 'ELECTCAST,AKMEFIN,HCLTECH' }}
          SECTIONS: ${{ inputs.sections || '' }}
        run: python -u scripts/corporate_peek.py
