name: Announcement reader

# Today's useful NSE and BSE filings read by the lanes of scripts/announcement_readers.txt, every value
# checked against its quote (scripts/announcement_reader.py, docs/ANNOUNCEMENT_READER.md). Writes
# archive/announcement_reads/, clean/current/announcement_reads.parquet and the day's usage log in
# clean/reports/announcement_reader/. Every 30 minutes through the day (filings come at all hours).
# On a PR: three filings read, nothing written, and only when the reader's own files change in the push.
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Read at most this many filings (empty = as many as the time allows)'
        required: false
        default: ''
  schedule:
    - cron: '7,37 * * * *'
  pull_request:
    paths:
      - 'scripts/announcement_reader.py'
      - 'scripts/announcement_sample.py'   # its prompts, model clients and checks
      - 'scripts/announcement_readers.txt'
      - '.github/workflows/announcement-reader.yml'

permissions:
  contents: read

concurrency:
  group: announcement-reader-${{ github.event_name == 'pull_request' && 'pr' || 'live' }}
  cancel-in-progress: false   # a run in progress finishes; a newer pending run replaces the older one

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed in this push?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$before" "${{ github.event.pull_request.head.sha }}" | grep -qE '^(scripts/announcement_(reader|sample)\.py|scripts/announcement_readers\.txt|\.github/workflows/announcement-reader\.yml)$'; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "The reader's files did not change in this push; nothing read." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.go == '1'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.changed.outputs.go == '1'
        run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read
        if: steps.changed.outputs.go == '1'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX: ${{ github.event_name == 'pull_request' && '3' || inputs.max || '' }}
          DRY: ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
        run: python -u scripts/announcement_reader.py $DRY ${MAX:+--max "$MAX"}
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.go == '1'
        with:
          name: announcement-reader-dry-run
          path: announcement_reader_dry_run.json
          if-no-files-found: ignore
