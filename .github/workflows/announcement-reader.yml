name: Unified announcement pipeline

# CONTINUOUS MODE (owner, 17 Oct 2026: "make everything live, we will monitor cards on the site in real time"): a run started with
# chain=true ends by starting the next one (10 minutes after it began, 30 after a failure), reads the newest filings first
# (up to `max`, for `minutes`), saves what it reads to R2 as it goes, and uses the page-image second reading and PaddleOCR for scanned pages.
# Company history (old announcements) runs only 22:30-09:00 IST, after the live queue is clear; by day the chain reads live filings only. TO STOP: cancel the running run, or run it by hand with chain=false; nothing else starts it.
# (Supervised mode of 16 Oct, kept in docs/BLUEPRINT_TODO.md 12.22: no schedule, no self-dispatch.)

# One serialized workflow handles current NSE/BSE announcements and targeted company history.
# Historical AI reads are triggered only by eligible companies with current announcements; source collection
# advances by one verified date per run through yesterday. This replaces the separate announcement collector
# and backfill workflows. Current cards are never held hostage by historical or model-quota failures.
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Read at most this many current filings (empty = as many as the time allows)'
        required: false
        default: '25'
      prompt_variant:
        description: 'Headline prompt for the run'
        required: true
        type: choice
        options:
          - baseline
          - v2
        default: v2
      dry_run:
        description: 'Do not write to R2'
        required: true
        type: boolean
        default: false
      history:
        description: 'Also read company history after the live queue (off in supervised mode)'
        required: true
        type: boolean
        default: false
      minutes:
        description: 'Stop starting new reads after this many minutes (default 11; a 100-filing supervised run needs about 80)'
        required: false
        default: '11'
      batch:
        description: 'Gemini lane: read short filings several to a request (saves calls; each filing still checked alone)'
        required: true
        type: boolean
        default: false
      vision:
        description: 'Cards the text read could not make safe are read again from page images (Gemini, page triage); off by default'
        required: true
        type: boolean
        default: false
      docling:
        description: 'Scanned pages of figures are also read with Docling (slower, about 20 s a page; better on tables)'
        required: true
        type: boolean
        default: false
      paddle:
        description: 'Scanned pages of figures are also read with PaddleOCR (about 30 s a page; most accurate in the 17 Oct benchmark)'
        required: true
        type: boolean
        default: false
      replay:
        description: 'Engineering loop: file of event_ids in the repo (scripts/golden_set.txt); read exactly these filings again, save nothing'
        required: false
        default: ''
      chain:
        description: 'Start the next run when this one ends (off in supervised mode)'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/announcement_reader.py'
      - 'scripts/announcement_backfill.py'
      - 'scripts/announcement_sample.py'
      - 'scripts/announcement_readers.txt'
      - 'collectors/nse_events/run_daily.py'
      - 'collectors/nse_events/announcements.py'
      - 'collectors/nse_events/client.py'
      - 'tests/test_announcement_reader.py'
      - 'tests/test_announcement_backfill.py'
      - 'tests/test_announcements.py'
      - 'tests/test_nse_announcement_parser.py'
      - '.github/workflows/announcement-reader.yml'

permissions:
  contents: read
  actions: write

concurrency:
  # One production pipeline; experiments on PRs/branches remain isolated.
  group: ${{ github.event_name == 'pull_request' && 'announcement-pipeline-pr' || (github.ref == 'refs/heads/main' && 'nse-announcements-unified' || github.ref_name) }}
  # Cancel stale PR dry-runs so only the newest PR version is active; serialize production runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # the reader stops starting reads after `minutes` (11 by default; 80 for a supervised 100)
    outputs:
      started: ${{ steps.start.outputs.at }}
      exhausted: ${{ steps.reader.outputs.quota_exhausted }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Stop competing announcement workflows
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in announcement-reader.yml announcements.yml announcement-history-backfill.yml; do
            for status in queued in_progress; do
              ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --status "$status" --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
              for id in $ids; do
                # Never cancel the run performing this cleanup; cancel older queued/live copies.
                [ "$id" = "$GITHUB_RUN_ID" ] && continue
                echo "Cancelling competing announcement workflow $workflow run $id"
                gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
              done
            done
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed in this push?
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$before" "${{ github.event.pull_request.head.sha }}" | grep -qE '^(scripts/announcement_(reader|backfill|sample)[.]py|scripts/announcement_readers[.]txt|collectors/nse_events/(run_daily|announcements|client)[.]py|tests/test_(announcement_(reader|backfill)|announcements|nse_announcement_parser)[.]py|[.]github/workflows/announcement-reader[.]yml)$'; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"; echo "The unified pipeline's files did not change in this push; nothing read." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.go == '1'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.changed.outputs.go == '1'
        run: |
          pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
          if [ "${{ inputs.docling }}" = "true" ]; then pip install docling; fi
          if [ "${{ inputs.paddle }}" = "true" ]; then pip install paddlepaddle "paddleocr[all]"; fi
      - name: Guard experimental prompt
        if: github.event_name == 'workflow_dispatch' && inputs.prompt_variant == 'v2' && inputs.dry_run != true && github.ref != 'refs/heads/main'
        run: |
          echo "Prompt v2 is production-enabled only on main; experimental branches must use dry_run=true." >&2
          exit 1
      - name: Read unified pipeline
        id: reader
        if: steps.changed.outputs.go == '1'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          READER_MINUTES: ${{ inputs.minutes || '11' }}
          READER_HISTORY: ${{ inputs.history == true && '1' || (inputs.chain == true && 'night' || '0') }}
          READER_BATCH: ${{ inputs.batch == true && '1' || '0' }}
          READER_VISION: ${{ inputs.vision == true && '1' || '0' }}
          READER_DOCLING: ${{ inputs.docling == true && '1' || '0' }}
          READER_PADDLE: ${{ inputs.paddle == true && '1' || '0' }}
          FLAGS_use_mkldnn: '0'
          REPLAY: ${{ inputs.replay || '' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX: ${{ github.event_name == 'pull_request' && '3' || inputs.max || '' }}
          CARD_PROMPT_VARIANT: ${{ github.event_name == 'pull_request' && 'baseline' || inputs.prompt_variant || 'v2' }}
          CARD_PROMPT_COMPARE: ${{ github.event_name == 'pull_request' && '1' || (inputs.replay == '' && inputs.dry_run == true && '1' || '0') }}
          DRY: ${{ github.event_name == 'pull_request' && '--dry-run' || (inputs.dry_run == true && '--dry-run' || '') }}
        run: python -u scripts/announcement_reader.py $DRY ${MAX:+--max "$MAX"} ${REPLAY:+--replay "$REPLAY"}

      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.go == '1' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true))
        with:
          name: announcement-pipeline-dry-run
          path: |
            announcement_reader_dry_run.json
            announcement_reader_xbrl_audit.json
          if-no-files-found: ignore

  next:
    needs: read
    # Never self-dispatch from PR dry-runs or an explicitly requested manual dry-run.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.dry_run != true && inputs.chain == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.read.outputs.started }}
          RESULT: ${{ needs.read.result }}
          EXHAUSTED: ${{ needs.read.outputs.exhausted }}
        run: |
          now=$(date +%s); started=${STARTED:-$now}
          if [ "$RESULT" = "success" ]; then gap=600; else gap=1800; fi
          # every model out of quota for the day: look again in an hour (source collection continues, no model work)
          if [ "$EXHAUSTED" = "1" ]; then gap=3600; fi
          wait=$(( started + gap - now ))
          if [ "$wait" -gt 0 ]; then echo "waiting ${wait}s ($RESULT)"; sleep "$wait"; fi
          gh workflow run announcement-reader.yml --repo "$GITHUB_REPOSITORY" --ref main -f prompt_variant=v2 -f dry_run=false -f history=false -f batch=false -f chain=true -f max=100 -f minutes=40 -f vision=true -f paddle=true -f docling=false
          echo "next unified pipeline run requested" >> "$GITHUB_STEP_SUMMARY"
