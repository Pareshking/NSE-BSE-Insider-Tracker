name: Attachment link probe (read-only)

# Do old filing links still return the document (scripts/attachment_link_probe.py). About 60 requests to the exchanges.
# Reads R2 and requests the first bytes of sampled filing links; no model, no write.
on:
  workflow_dispatch:
  push:
    branches: [ccr-0caa4ce9-bh3n2s]
    paths:
      - 'scripts/attachment_link_probe.py'
      - '.github/workflows/attachment-link-probe.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/attachment_link_probe.py
