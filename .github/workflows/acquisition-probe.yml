name: NSE-BSE Acquisition Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe NSE and BSE
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/acquisition_probe.py

      - name: Publish probe report to repository
        if: always()
        run: |
          mkdir -p artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f artifacts/acquisition_probe.json ]; then
            git add artifacts/acquisition_probe.json
            git diff --cached --quiet || git commit -m "chore: publish acquisition probe [skip ci]"
            git push
          fi

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-acquisition-probe
          path: artifacts/acquisition_probe.json
          retention-days: 14
