name: NSE-BSE Acquisition Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: NSE Insider acquisition
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/nse_insider.py
      - name: NSE Bulk acquisition
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/nse_bulk.py
      - name: NSE Block acquisition
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/nse_block.py
      - name: Legacy orchestrator evidence
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/acquisition_probe.py
      - name: Capture BSE evidence
        run: python scripts/bse_raw_capture_v2.py
      - name: Validate NSE and BSE real records
        env:
          TARGET_DATE: '2026-08-31'
          SECOND_DATE: '2026-08-28'
        run: python scripts/data_validation_v4.py
      - name: Publish reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add artifacts
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish acquisition and validation evidence [skip ci]"
            git push origin main
          fi
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-acquisition-validation-v4
          path: artifacts
          retention-days: 14
