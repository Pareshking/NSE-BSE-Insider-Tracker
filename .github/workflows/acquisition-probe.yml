name: NSE-BSE Acquisition Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe NSE and BSE
        env:
          TARGET_DATE: '2026-08-31'
        run: python scripts/acquisition_probe.py
      - name: Capture full BSE rendered records
        run: python scripts/bse_raw_capture.py
      - name: Validate NSE and BSE real records
        env:
          TARGET_DATE: '2026-08-31'
          SECOND_DATE: '2026-08-28'
        run: python scripts/data_validation_v3.py
      - name: Publish reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/acquisition_probe.json artifacts/data_validation_v3
          git diff --cached --quiet || git commit -m "chore: publish acquisition and NSE BSE validation v3 [skip ci]"
          git push
      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-bse-acquisition-validation-v3
          path: |
            artifacts/acquisition_probe.json
            artifacts/data_validation_v3
          retention-days: 14
