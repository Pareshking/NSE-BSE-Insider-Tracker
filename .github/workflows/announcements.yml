name: NSE Announcements (daily)

# Every NSE announcement of the last 3 days (main board and SME) ->
# raw_v2/nse/announcements/ and archive/announcements/nse/, then every BSE
# announcement -> raw_v2/bse/announcements/ and archive/announcements/bse/,
# with counts by subject and reading group on the run page and in
# clean/reports/announcements/ and announcements_bse/. No model reads anything yet
# (docs/TODO.md item 29). Separate from the other collectors so a failure
# here never affects them.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back (default 3)'
        required: false
        default: '3'
      from:
        description: 'History: first day to fetch, YYYY-MM-DD, one month per call; empty = the usual window'
        required: false
        default: ''
  schedule:
    - cron: '15 17 * * *'  # 22:45 IST every day (filings are broadcast on weekends too)

permissions:
  contents: read

concurrency:
  group: nse-announcements
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # BSE: ~23 pages a day, 4-6 s apart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect NSE announcements
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          FROM: ${{ inputs.from || '' }}
        run: python -m collectors.nse_events.announcements --days "${{ inputs.days || '3' }}" ${FROM:+--from "$FROM"}
      - name: Collect BSE announcements
        if: always()   # a failed NSE step must not cost the BSE filings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          FROM: ${{ inputs.from || '' }}
        run: python -u -m collectors.bse.announcements --days "${{ inputs.days || '3' }}" ${FROM:+--from "$FROM"}
