name: Sample rights and preferential data (read-only)

# Prints the columns, fill rates, short-value lists and example rows of the
# stored NSE and BSE rights and preferential issue data. Writes nothing.
# The push trigger is temporary, for running this from its branch.

on:
  workflow_dispatch:
  push:
    branches: [ccr-d8fff3f9-npgfmg]
    paths: ['.github/workflows/sample-issue-data.yml', 'scripts/sample_issue_data.py']

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sample
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/sample_issue_data.py
