name: NSE Corporate Events (daily)

# SAST Reg 29, corporate actions, board meetings, shareholding + pledges,
# buyback tender offers and daily buyback reports.
# further issues (preferential, rights, QIP filings and their XBRL).
# Fetches the last 10 days each run and merges by event ID, so re-runs and
# late filings are safe. Separate from the R2 Storage Write workflow so a
# failure here never affects insider/deal collection.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back (default 10)'
        required: false
        default: '10'
      dataset:
        description: 'all | sast | actions | meetings | shareholding | tenders | daily_buybacks | issues | results'
        required: false
        default: 'all'
      from:
        description: 'Board meetings backfill (dataset=meetings only): first day to fetch, YYYY-MM-DD, one month per call; empty = the usual window'
        required: false
        default: ''
      chain:
        description: 'Shareholding catch-up: 1 = start the next run by itself while pledge files are still pending'
        required: false
        default: '0'
      round:
        description: 'Catch-up round number (set by the workflow)'
        required: false
        default: '1'
      max_results_xbrl:
        description: 'dataset=results: results XBRL files to fetch this run (nightly 500; a backfill 3000)'
        required: false
        default: '500'
      results_workers:
        description: 'dataset=results: files fetched at once (nightly 1 with NSE pause; a backfill 4)'
        required: false
        default: '1'
      results_from:
        description: 'dataset=results backfill: first day of the window to list, YYYY-MM-DD (empty = the last `days`)'
        required: false
        default: ''
      results_to:
        description: 'dataset=results backfill: last day of the window (empty = today)'
        required: false
        default: ''
      reparse_raw:
        description: 'dataset=shareholding: 1 = no NSE call; fill ownership by investor type from the XBRLs kept in raw_v2/'
        required: false
        default: '0'
  schedule:
    - cron: '0 16 * * 1-6'  # 21:30 IST, Monday-Saturday
    - cron: '30 19 * * 1-6'  # 01:00 IST: backup, runs only when tonight's run did not succeed

permissions:
  contents: read
  actions: write   # only for the catch-up chain below

concurrency:
  group: nse-events
  cancel-in-progress: false

jobs:
  guard:
    # The backup schedule runs only when no scheduled run of this workflow succeeded in the last 10 hours
    # (GitHub starts scheduled runs late, or drops them: 21 and 22 Oct 2026). Every other start runs as asked.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$CRON" != "30 19 * * 1-6" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '10 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nse-events.yml --event schedule --status success --created ">=$since" --json databaseId --jq length || echo 0)
          # Tonight's run started late and still running (or waiting for the group) is no failure either: a second
          # full run behind it would only repeat it.
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nse-events.yml --event schedule --created ">=$since" --json databaseId,status --jq "[.[] | select(.status != \"completed\" and .databaseId != $GITHUB_RUN_ID)] | length" || echo 0)
          if [ "${n:-0}" -gt 0 ] || [ "${busy:-0}" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "tonight's run succeeded or is running: backup skipped"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  collect:
    needs: guard
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect NSE corporate events
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          FROM: ${{ inputs.from || '' }}
          RFROM: ${{ inputs.results_from || '' }}
          RTO: ${{ inputs.results_to || '' }}
          REPARSE: ${{ inputs.reparse_raw == '1' && '--reparse-raw' || '' }}
        run: python -m collectors.nse_events.run_daily --days "${{ inputs.days || '10' }}" --dataset "${{ inputs.dataset || 'all' }}" --max-results-xbrl "${{ inputs.max_results_xbrl || '500' }}" --results-workers "${{ inputs.results_workers || '1' }}" ${RFROM:+--results-from "$RFROM"} ${RTO:+--results-to "$RTO"} ${FROM:+--from "$FROM"} $REPARSE
      # Shareholding catch-up. Each run parses at most 300 pledge files (NSE
      # rate-limits by IP); with chain=1 the next run starts by itself while
      # files are pending, up to 15 rounds, and stops if NSE refused a file
      # or this run parsed nothing. Pending includes companies whose latest
      # filing has no promoter-group member list yet (TODO item 21): after the
      # first deploy, run dataset=shareholding, days=120, chain=1 once.
      # Ownership by investor type (pending_categories): first dataset=shareholding,
      # reparse_raw=1 (no NSE call, the kept XBRLs), then days=400, chain=1 for the
      # filings with no raw copy.
      - name: Continue the catch-up
        if: ${{ inputs.chain == '1' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round || '1' }}
          DAYS: ${{ inputs.days || '10' }}
          DATASET: ${{ inputs.dataset || 'all' }}
          MAXRES: ${{ inputs.max_results_xbrl || '500' }}
          WORKERS: ${{ inputs.results_workers || '1' }}
          RFROM: ${{ inputs.results_from || '' }}
          RTO: ${{ inputs.results_to || '' }}
        run: |
          [ -f nse_events_report.json ] || { echo "no report written; stopping"; exit 0; }
          if [ "$DATASET" = "results" ]; then
            # results backfill: another round while filings are pending, this round fetched some and NSE refused none
            read -r PENDING FETCHED BLOCKED < <(python - <<'PY'
          import json
          r = json.load(open('nse_events_report.json'))
          print(r.get('pending_results', 0), r.get('results_xbrl_fetched', 0), int(bool(r.get('results_xbrl_blocked'))))
          PY
          )
            # later rounds list only the last 10 days: filings still pending are retried from the archive whatever the window
            LIMIT=120
            # Same window again while filings are pending; when none are, the next older window of 90 days,
            # down to HORIZON (about 12 quarters back). Pending filings are retried from the archive whatever the window.
            HORIZON=2023-10-01
            if [ -n "$RFROM" ] && [ "$PENDING" -eq 0 ] && [ "$BLOCKED" -eq 0 ] && [[ "$RFROM" > "$HORIZON" ]]; then
              NTO=$(date -d "$RFROM - 1 day" +%F); NFROM=$(date -d "$RFROM - 90 days" +%F)
              [[ "$NFROM" < "$HORIZON" ]] && NFROM=$HORIZON
              NEXT="gh workflow run nse-events.yml -f days=10 -f dataset=results -f chain=1 -f round=$((ROUND + 1)) -f max_results_xbrl=$MAXRES -f results_workers=$WORKERS -f results_from=$NFROM -f results_to=$NTO"
              PENDING=1; FETCHED=1
            else
              NEXT="gh workflow run nse-events.yml -f days=10 -f dataset=results -f chain=1 -f round=$((ROUND + 1)) -f max_results_xbrl=$MAXRES -f results_workers=$WORKERS${RFROM:+ -f results_from=$RFROM -f results_to=$RTO}"
            fi
          else
            read -r PENDING FETCHED BLOCKED < <(python - <<'PY'
          import json
          r = json.load(open('nse_events_report.json'))
          print(r.get('pending_xbrl', 0) + r.get('pending_members', 0) + r.get('pending_categories', 0), r.get('xbrl_fetched', 0), int(bool(r.get('xbrl_blocked'))))
          PY
          )
            LIMIT=15
            NEXT="gh workflow run nse-events.yml -f days=$DAYS -f dataset=shareholding -f chain=1 -f round=$((ROUND + 1))"
          fi
          echo "round $ROUND: pending $PENDING, parsed $FETCHED, refused $BLOCKED"
          if [ "$PENDING" -gt 0 ] && [ "$FETCHED" -gt 0 ] && [ "$BLOCKED" -eq 0 ] && [ "$ROUND" -lt "$LIMIT" ]; then
            # A queued run (the nightly collection) must not be replaced by the next round: GitHub keeps only the newest
            # waiting run (15 Oct 2026: the nightly was cancelled that way). Pause; the resume line below restarts it.
            # Every waiting state counts: a run held by the concurrency group shows as pending, not queued, and the
            # check on queued alone let round 5 cancel the nightly of 21 Oct 2026 (run 39663939917).
            WAITING=$(gh run list --workflow nse-events.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length' 2>/dev/null || echo 0)
            if [ "${WAITING:-0}" -gt 0 ]; then
              echo "another run is waiting; the catch-up pauses. Resume with: $NEXT"
            else
              $NEXT
              echo "started round $((ROUND + 1))"
            fi
          else
            echo "catch-up finished or stopped"
          fi
