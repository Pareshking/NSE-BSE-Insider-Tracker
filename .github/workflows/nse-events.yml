name: NSE Corporate Events (daily)

# SAST Reg 29, corporate actions, board meetings, shareholding + pledges.
# Fetches the last 10 days each run and merges by event ID, so re-runs and
# late filings are safe. Separate from the R2 Storage Write workflow so a
# failure here never affects insider/deal collection.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to look back (default 10)'
        required: false
        default: '10'
      dataset:
        description: 'all | sast | actions | meetings | shareholding'
        required: false
        default: 'all'
  schedule:
    - cron: '0 16 * * 1-6'  # 21:30 IST, Monday-Saturday

permissions:
  contents: read

concurrency:
  group: nse-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect NSE corporate events
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m collectors.nse_events.run_daily --days "${{ inputs.days || '10' }}" --dataset "${{ inputs.dataset || 'all' }}"
