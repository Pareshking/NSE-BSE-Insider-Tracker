name: Text size probe (read-only)

# Extracted-text size of a random sample of filings (scripts/text_size_probe.py). About 80 downloads.
# Reads R2 and downloads sampled filings; no model, no write.
on:
  workflow_dispatch:
  push:
    branches: [ccr-0caa4ce9-bh3n2s]
    paths:
      - 'scripts/text_size_probe.py'
      - '.github/workflows/text-size-probe.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/text_size_probe.py
