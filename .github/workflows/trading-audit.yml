name: Trading audit (read-only)

# The trading data on real rows for the data chain audit (scripts/trading_audit.py). Reads R2 only; no exchange call, no write.
on:
  workflow_dispatch:
    inputs:
      sections:
        description: 'Comma list: insider,dups,roles,price,deals,sast,pledge,today (empty = all)'
        required: false
        default: ''
  push:
    branches: [audit/trading-data]
    paths:
      - 'scripts/trading_audit.py'
      - '.github/workflows/trading-audit.yml'

permissions:
  contents: read

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Peek
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SECTIONS: ${{ inputs.sections || '' }}
        run: python -u scripts/trading_audit.py
