name: OCR benchmark (tesseract / PaddleOCR / Docling / Marker)

# Read-only (17 Oct 2026, owner's request): the same filing pages, each engine scored on cells read off the page images.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ocr_benchmark.py'
      - '.github/workflows/ocr-benchmark.yml'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [tesseract, docling, paddle, paddle_mobile, paddle_structure_lite, paddle_structure_text]   # paddle_structure (default models) is killed by the 7 GB runner: run it by hand on a larger machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Install the engine
        run: |
          case "${{ matrix.engine }}" in
            paddle|paddle_mobile|paddle_structure|paddle_structure_lite|paddle_structure_text) pip install paddlepaddle "paddleocr[all]" ;;
            docling) pip install docling ;;
            marker)
              pip install marker-pdf
              mkdir -p "$HOME/llama" && cd "$HOME/llama"
              gh release download --repo ggml-org/llama.cpp --pattern '*ubuntu-x64*.zip' --pattern '*ubuntu-x64*.tar.gz'
              for z in *.zip; do unzip -qo "$z"; done; for z in *.tar.gz; do tar xzf "$z"; done
              echo "LLAMA_CPP_BINARY=$(find "$HOME/llama" -name llama-server | head -1)" >> "$GITHUB_ENV"; chmod +x "$(find "$HOME/llama" -name llama-server | head -1)"
              ;;
          esac
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Benchmark
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ENGINE: ${{ matrix.engine }}
          PATH_EXTRA: ${{ env.LLAMA_DIR }}
          FLAGS_use_mkldnn: '0'
          FLAGS_enable_pir_api: '0'
          OUT_DIR: ocr_out
        run: PATH="$PATH:${LLAMA_DIR:-/usr/bin}" python -u scripts/ocr_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-${{ matrix.engine }}
          path: ocr_out
