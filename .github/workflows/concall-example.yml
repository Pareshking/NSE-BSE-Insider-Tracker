name: Concall example (read-only)

# Worked example (owner, 18 Oct 2026): a prior quarter's call transcript read into verified facts and used as context for this
# quarter's results card (scripts/concall_example.py). Reads R2 and calls the AI lanes; writes nothing to R2.
on:
  workflow_dispatch:
    inputs:
      isin:
        required: true
        default: 'INE467B01029'
      symbol:
        required: true
        default: 'TCS'
      company:
        required: true
        default: 'Tata Consultancy Services Limited'
      prior_transcript:
        description: 'NSE event_id of the prior quarter call transcript'
        required: true
        default: 'nse:106699212'
      results:
        description: 'NSE event_id of this quarter results filing'
        required: true
        default: 'nse:106811193'

permissions:
  contents: read

concurrency:
  group: concall-example

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISIN: ${{ inputs.isin }}
          SYMBOL: ${{ inputs.symbol }}
          COMPANY: ${{ inputs.company }}
          PRIOR_TRANSCRIPT: ${{ inputs.prior_transcript }}
          RESULTS: ${{ inputs.results }}
        run: python -u scripts/concall_example.py
