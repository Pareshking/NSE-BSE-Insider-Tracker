name: R2 size report (read-only)

# What the R2 bucket holds by prefix, and whether any raw PDFs are in it (scripts/r2_size_report.py).
# Reads R2 only; no model, no exchange call, no write.
on:
  workflow_dispatch:
  push:
    branches: [ccr-0caa4ce9-bh3n2s]
    paths:
      - 'scripts/r2_size_report.py'
      - '.github/workflows/r2-size-report.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/r2_size_report.py
