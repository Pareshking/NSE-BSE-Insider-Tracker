name: R2 Storage Write (NSE + BSE)

on:
  workflow_dispatch:
    inputs:
      target_date:
        # MUST stay empty. This is what the run writes as manifests/{date}.json
        # and therefore what the app's "Run date" selector offers. A hardcoded
        # date here is not a harmless placeholder: "Run workflow" without
        # touching the field sends that date, the Determine-target-date step
        # below sees a non-empty input and honours it, and the run overwrites
        # that same day forever. With '2026-08-31' as the default, four
        # successful manual runs across 01-02 Sep 2026 all rewrote
        # manifests/2026-08-31.json, and the app looked frozen on 31 Aug while
        # the pipeline was in fact working perfectly.
        # Blank = today (UTC). Fill it in only to backfill a specific day.
        description: 'Target date (YYYY-MM-DD). Leave blank for today (UTC); set only to backfill.'
        required: false
        default: ''
      lookback_days:
        description: 'Historical lookback window'
        required: false
        default: '90'
  schedule:
    # 18:00 UTC = after both NSE and BSE end-of-day disclosures are published.
    - cron: '0 18 * * 1-5'

permissions:
  contents: read

jobs:
  acquire-validate-store:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # A scheduled (cron) trigger has no `inputs` context at all, so
      # `inputs.target_date` is always empty there -- a hardcoded fallback
      # date here meant the 18:00 UTC weekday schedule fetched the SAME
      # fixed date forever instead of advancing daily. Manual dispatch still
      # honors an explicit target_date; the schedule now correctly targets
      # "today" (UTC) every time it fires.
      - name: Determine target date
        id: target
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            echo "date=${{ inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      # --- Market cap reference data, both exchanges, whole-file downloads
      # only (no per-symbol lookups -- see scripts/*_market_cap.py). Neither
      # depends on any transaction data having been fetched first, so both
      # run up front. BSE before NSE per explicit ordering preference. ---
      - name: BSE market cap
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/bse_market_cap.py
      - name: NSE market cap
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_market_cap.py

      # --- NSE acquisition (5 categories) ---
      # R2 credentials here are for the per-filing cache, NOT for writing
      # datasets -- nse_insider.py only reads and updates
      # cache/nse_insider/parsed_filings.json. Without them the script still
      # runs, it just re-fetches every filing (which is what was tripping
      # NSE's rate limit and losing 74% of them).
      - name: NSE Insider
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/nse_insider.py
      - name: NSE Bulk
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_bulk.py
      - name: NSE Block
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_block.py
      - name: NSE Rights
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_rights.py
      - name: NSE Preferential
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_preferential.py
      - name: NSE evidence validation
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_validate.py

      # --- BSE acquisition (5 categories) ---
      - name: BSE raw acquisition
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/bse_raw_capture_v2.py
      - name: BSE evidence validation
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/bse_validate.py

      # --- Write only VERIFIED categories to R2 ---
      - name: Write validated datasets to R2
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/r2_writer.py

      # --- Backfill any recent weekday that never got a manifest (a prior
      # run that failed outright before reaching r2_writer.py) -- reuses
      # this run's already-fetched 90-day data, no new NSE/BSE calls. ---
      - name: Backfill missing recent manifests
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/backfill_gaps.py

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-storage-run-evidence
          path: |
            artifacts/nse_insider
            artifacts/nse_bulk
            artifacts/nse_block
            artifacts/nse_validation
            artifacts/bse_validation
            artifacts/data_validation_v5
          retention-days: 14
          if-no-files-found: warn
