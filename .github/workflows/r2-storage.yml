name: R2 Storage Write (NSE + BSE)

on:
  workflow_dispatch:
    inputs:
      target_date:
        # MUST stay empty. This is what the run writes as manifests/{date}.json
        # and therefore what the app's "Run date" selector offers. A hardcoded
        # date here is not a harmless placeholder: "Run workflow" without
        # touching the field sends that date, the Determine-target-date step
        # below sees a non-empty input and honours it, and the run overwrites
        # that same day forever. With '2026-08-31' as the default, four
        # successful manual runs across 01-02 Sep 2026 all rewrote
        # manifests/2026-08-31.json, and the app looked frozen on 31 Aug while
        # the pipeline was in fact working perfectly.
        # Blank = today (UTC). Fill it in only to backfill a specific day.
        description: 'Target date (YYYY-MM-DD). Leave blank for today (UTC); set only to backfill.'
        required: false
        default: ''
      lookback_days:
        description: 'Historical lookback window'
        required: false
        default: '90'
  schedule:
    # 18:00 UTC = after both NSE and BSE end-of-day disclosures are published.
    - cron: '0 18 * * 1-5'

permissions:
  contents: read
  actions: write   # only to start Precompute slim assets at the end

# Shared with the history backfill: both write archive/ partitions, so they
# never run at the same time; whichever starts second waits. (GitHub keeps one
# waiting run per group: a newer waiting run replaces an older waiting one.)
concurrency:
  group: r2-archive-writes
  cancel-in-progress: false

jobs:
  acquire-validate-store:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '90' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # A scheduled (cron) trigger has no `inputs` context at all, so
      # `inputs.target_date` is always empty there -- a hardcoded fallback
      # date here meant the 18:00 UTC weekday schedule fetched the SAME
      # fixed date forever instead of advancing daily. Manual dispatch still
      # honors an explicit target_date; the schedule now correctly targets
      # "today" (UTC) every time it fires.
      - name: Determine target date
        id: target
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            echo "date=${{ inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      # Old collector outputs are committed in the repo (artifacts/nse_insider,
      # artifacts/nse_bulk from 31 Aug). If a fetch crashes, the validator must
      # find nothing, not last month's file. (The validators also check the
      # report's target_date.)
      - name: Clear old collector outputs
        # Market-cap reports too (12 Oct 2026): a September copy of each sat in the repo, so a
        # failed market-cap step would have published those numbers as the day's market cap.
        run: rm -rf artifacts/nse_insider artifacts/nse_bulk artifacts/nse_block artifacts/nse_validation artifacts/bse_validation artifacts/data_validation_v5 artifacts/nse_market_cap artifacts/bse_market_cap

      # --- Market cap reference data, both exchanges, whole-file downloads
      # only (no per-symbol lookups -- see scripts/*_market_cap.py). Neither
      # depends on any transaction data having been fetched first, so both
      # run up front. BSE before NSE per explicit ordering preference. ---
      - name: BSE market cap
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/bse_market_cap.py
      - name: NSE market cap
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_market_cap.py

      # --- NSE acquisition (5 categories) ---
      # R2 credentials here are for the per-filing cache, NOT for writing
      # datasets -- nse_insider.py only reads and updates
      # cache/nse_insider/parsed_filings.json. Without them the script still
      # runs, it just re-fetches every filing (which is what was tripping
      # NSE's rate limit and losing 74% of them).
      - name: NSE Insider
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/nse_insider.py
      - name: NSE Bulk
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_bulk.py
      - name: NSE Block
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_block.py
      - name: NSE Rights
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_rights.py
      - name: NSE Preferential
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_preferential.py
      - name: NSE evidence validation
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/nse_validate.py

      # --- BSE acquisition (5 categories) ---
      - name: BSE raw acquisition
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/bse_raw_capture_v2.py
      - name: BSE evidence validation
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: python scripts/bse_validate.py

      # Prices: until 12 Oct 2026 only the manual Price backfill wrote
      # prices/daily/, so every price on the site stopped at the last manual
      # run (08 Oct). Each nightly now fetches the last 10 days (NSE and BSE
      # bhavcopy, NSE market cap, NSE index closes); days already stored are
      # skipped, so a missed night is filled by the next. Before the
      # tradability step, the clean step's price check and Precompute, which read them.
      - name: Prices (last 10 days, resumable)
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/price_backfill.py --from "$(date -u -d '10 days ago' +%F)" --to "$(date -u +%F)" --exchange NSE,BSE,NSE_PR,NSE_IDX

      # --- NSE surveillance lists and price bands -> clean/current/tradability.parquet
      # (scripts/nse_surveillance.py). Its raw answers are captured for the
      # raw step below. Flags only; it can never fail the collection. ---
      - name: NSE surveillance and tradability flags
        if: always()
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/nse_surveillance.py

      # --- Write only VERIFIED categories to R2 ---
      - name: Store raw responses (write-once)
        # Everything the collectors above fetched, byte for byte, into
        # raw_v2/ in R2 (insiders_clean/raw_store.py). Goes red if any
        # capture could not be stored.
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/raw_flush.py

      - name: Write validated datasets to R2
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/r2_writer.py

      # --- Backfill any recent weekday that never got a manifest (a prior
      # run that failed outright before reaching r2_writer.py) -- reuses
      # this run's already-fetched 90-day data, no new NSE/BSE calls. ---
      - name: Backfill missing recent manifests
        if: always()
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/backfill_gaps.py

      # --- BSE through its own history endpoints (collectors/bse/client.py) ---
      # The capture above reads BSE's page defaults (today's deals; an insider
      # list of the day's filings plus a fixed older block), so a day it missed
      # is never filled. These read the last days again from BSE's history
      # endpoints into archive/canonical/bse/ (deals the capture stored are not
      # written twice; the clean step links the two insider feeds), then SAST,
      # corporate actions, board meetings and shareholding patterns into
      # archive/bse_events/ and clean/current/bse_{sast,actions,meetings,shareholding}.parquet,
      # linked to NSE's tables (written by NSE Corporate Events at 16:00 UTC).
      # Before the clean step, which reads bse_meetings (results dates of
      # BSE-only companies) and bse_promoter_group. Neither can fail the run.
      - name: BSE insider and deals, last 10 days
        if: always()
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/bse_history_backfill.py --dataset all --recent 10
      - name: BSE SAST, corporate actions, board meetings and shareholding, last 30 days
        if: always()
        continue-on-error: true
        # About 170 BSE calls at 4-6 s (150 shareholding XBRLs at most); a stall cannot hold up the clean step.
        timeout-minutes: 30
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u -m collectors.bse.events --days 30

      # --- Clean layer: archive every record once, rebuild clean/ from it ---
      # The calendar step first, so tonight's deadlines can use tonight's
      # confirmed sessions. Neither step can make the acquisition fail.
      - name: Extend NSE trading calendar
        if: always()
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/update_calendar.py
      - name: Archive and clean
        if: always()
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/clean_writer.py

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-storage-run-evidence
          path: |
            artifacts/nse_insider
            artifacts/nse_bulk
            artifacts/nse_block
            artifacts/nse_validation
            artifacts/bse_validation
            artifacts/data_validation_v5
          retention-days: 14
          if-no-files-found: warn

      # Precompute (price summary, market strip, track record) used to start
      # from a workflow_run trigger, which has not fired after any run since
      # 9 Oct. Starting it from here is certain; it waits in the shared
      # concurrency group until this run is done. Runs even when a collector
      # step failed: the price layer does not depend on them.
      - name: Start Precompute slim assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run precompute-slim.yml --ref "${{ github.ref_name }}"
