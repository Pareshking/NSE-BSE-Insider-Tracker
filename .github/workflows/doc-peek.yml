name: Doc peek (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/peek_urls.txt'
      - 'scripts/doc_peek.py'
      - '.github/workflows/doc-peek.yml'
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - run: python -u scripts/doc_peek.py
