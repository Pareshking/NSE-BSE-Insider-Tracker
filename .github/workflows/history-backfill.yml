name: NSE History Backfill

# One-off backfill of NSE insider filings (19 Nov 2015 - 02 May 2026) and
# bulk / block deals (2004 / 2005 onwards) into archive/ in R2. See
# scripts/nse_history_backfill.py and docs/CLEAN_LAYER.md ("Backfill").
#
# DRY RUN by default: fetches and maps, prints counts, writes nothing.
# Resumable: rerunning skips the chunks already stored. Do not start it
# while the nightly R2 Storage Write run (18:00 UTC) is in progress: both
# write archive partitions.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'insider, bulk, block or all'
        type: choice
        options: [insider, bulk, block, all]
        default: insider
      from:
        description: 'From (YYYY-MM-DD). Blank = start of the dataset.'
        required: false
        default: ''
      to:
        description: 'To (YYYY-MM-DD). Blank = 02 May 2026 for insider; for deals, the day before the earliest nightly record.'
        required: false
        default: ''
      dry_run:
        description: "'true' = fetch and map only, write nothing"
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: read

concurrency:
  group: history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DATASET: ${{ inputs.dataset }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--dataset "$DATASET")
          if [ -n "$FROM" ]; then args+=(--from "$FROM"); fi
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/nse_history_backfill.py "${args[@]}"
