name: Industry speed test (read-only)
# Times faster ways to get the 4-level industry on a GitHub runner; nothing is stored (scripts/industry_speedtest.py).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/industry_speedtest.py
      - .github/workflows/industry-speedtest.yml
jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u scripts/industry_speedtest.py
