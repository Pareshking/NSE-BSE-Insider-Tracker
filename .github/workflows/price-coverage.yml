name: Price coverage (read-only)

# Aggregate coverage of the native price layer against the 2026 clean events, plus a check that every
# stored price day has its raw file in raw_v2. Reads R2 only. Aggregate output only (public repo).
on:
  workflow_dispatch:
  # Temporary: lets the working branch start the first run before this file is on main.
  push:
    branches: [ccr-27a6c75f-o9ztpa]
    paths: ['.github/workflows/price-coverage.yml']

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coverage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/price_coverage.py --out coverage
      - name: Job summary
        if: always()
        run: |
          if [ -f coverage/coverage.md ]; then cat coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-coverage
          path: coverage
          retention-days: 14
# smoke run on the sample months (Sep-Oct 2026) while the full backfill loads
# progress check run 10:19Z
