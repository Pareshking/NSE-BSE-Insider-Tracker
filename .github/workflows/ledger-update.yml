name: Forward ledger update

# Appends new promoter signals (v1 and v2 series, disclosed after 2026-06-30) to ledger/forward_ledger.parquet in R2, after the nightly run or on dispatch.
# Append-only: existing rows are never changed. Dispatch only; aggregate output only.
on:
  workflow_dispatch:
  # After the nightly archive-and-clean run on main finishes successfully (chain: R2 Storage Write -> this -> Precompute slim assets).
  workflow_run:
    workflows: ["R2 Storage Write (NSE + BSE)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: r2-archive-writes
  cancel-in-progress: false

jobs:
  ledger:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Append signals
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/ledger_update.py | tee ledger.log
      - name: Summary
        if: always()
        run: |
          echo '### Forward ledger (aggregate)' >> "$GITHUB_STEP_SUMMARY"
          grep '^ledger:' ledger.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
