name: Forward ledger update

# Appends new promoter-accumulation signals (disclosed after 2026-06-30) to ledger/forward_ledger.parquet in R2.
# Append-only: existing rows are never changed. Dispatch only; aggregate output only.
on:
  workflow_dispatch:
  push:   # TEMPORARY: one-off run from the feature branch; removed in the next commit
    branches: [feat/phase3-ui-shell]
    paths: ['.github/workflows/ledger-update.yml']

permissions:
  contents: read

concurrency:
  group: r2-archive-writes
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Append signals
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -u scripts/ledger_update.py | tee ledger.log
      - name: Summary
        if: always()
        run: |
          echo '### Forward ledger (aggregate)' >> "$GITHUB_STEP_SUMMARY"
          grep '^ledger:' ledger.log | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
