name: Announcement 3-Filing Sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: announcement-three-filing-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Run dry-run sample (maximum 3 filings)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_MINUTES: "10"
          CARD_PROMPT_VARIANT: baseline
        run: python -u scripts/announcement_reader.py --dry-run --max 3 --minutes 10
      - name: Upload sample report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-three-filing-sample
          path: |
            announcement_reader_dry_run.json
            announcement_reader_xbrl_audit.json
          if-no-files-found: warn
          retention-days: 7
