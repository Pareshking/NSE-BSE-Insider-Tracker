[theme]
# Written by scripts/sync_theme.py from streamlit_app/ui/theme.py: change the tokens there, not here.
base = "light"
primaryColor = "#4F5BD5"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
linkColor = "#3F49B8"
linkUnderline = false
borderColor = "#E3E6EA"
showWidgetBorder = true
baseRadius = "10px"
greenColor = "#15803D"
redColor = "#C2410C"
orangeColor = "#B45309"
dataframeHeaderBackgroundColor = "#F1F2F6"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"

[client]
# Default is "full": an uncaught exception renders its type, message and
# full traceback in the browser. On this app a traceback exposes the R2
# bucket name, the account-scoped endpoint URL and server filesystem paths
# to anyone who can load the page. "none" keeps all of that server-side --
# expected failures are caught and explained by lib/r2_data.py instead.
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
