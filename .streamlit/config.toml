[theme]
# Light, high-density palette aligned with the owner's reference app (Pareshking/Paresh "Clear Ledger" tokens).
# The same colors are mirrored in streamlit_app/lib/style.py (COLORS) for the custom HTML.
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1726"
linkColor = "#4338CA"
linkUnderline = false
borderColor = "#D0D5DD"
showWidgetBorder = true
baseRadius = "10px"
greenColor = "#067647"
redColor = "#B42318"
orangeColor = "#B54708"
dataframeHeaderBackgroundColor = "#F4F5F8"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap, sans-serif"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..700&display=swap, monospace"

[client]
# Default is "full": an uncaught exception renders its type, message and
# full traceback in the browser. On this app a traceback exposes the R2
# bucket name, the account-scoped endpoint URL and server filesystem paths
# to anyone who can load the page. "none" keeps all of that server-side --
# expected failures are caught and explained by lib/r2_data.py instead.
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
